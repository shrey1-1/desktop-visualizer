<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: transparent;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: contain;
				opacity: 1;
				transition: opacity 0.8s ease;
			}
			body.hidden canvas {
				opacity: 0;
			}
		</style>
	</head>
	<body class="hidden">
		<canvas id="canvas"></canvas>
		<script src="shaders.js"></script>
		<script src="ncs.js"></script>
	</body>
</html>
